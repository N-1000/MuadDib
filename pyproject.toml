[project]
name = "muaddib"
version = "0.1.0"
description = "Intent router hibrido en cascada (reglas -> embeddings -> LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
