[project]
name = "muaddib"
version = "0.1.0"
description = "Intent router hibrido en cascada (reglas -> embeddings -> LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.9",
    "sentence-transformers>=6.0.1",
    "anthropic>=0.40.0",
    "jsonschema>=4.23.0",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
