# entities.yaml v1 — EcoPulse
#
# Catalogo de entidades para extract_entities(). Vive en su propio archivo,
# no en rules_nivel0.yaml (de donde salio originalmente al migrar
# agent_core.py) ni en canonical.yaml: las entidades no son de un nivel
# particular, las necesita el router para completar la accion de
# cualquier nivel (0, 1 o 2) que resuelva la intencion.
#
# "siloe" agregado como keyword de la region "occidente": aparecia en
# canonical.yaml (comparar_calidad_aire) y en frases.txt pero no en este
# catalogo, asi que la compuerta de cardinalidad de comparar_calidad_aire
# escalaba mensajes que deberia resolver. No hay acceso desde este repo
# al NodeDataService real para confirmar el node id -- geograficamente
# Siloe esta en la misma ladera occidental que Cristo Rey/Farallones/Los
# Cristales (ya cubiertos por "occidente"), asi que se agrego ahi. Si
# el backend real lo modela distinto, corregir aca.
#
# Pendiente, fuera de este barrido: "melendez" y "chipichape" aparecen en
# canonical.yaml/frases.txt como nombres de sensor/estacion, no de region,
# y no hay tipo de entidad "sensor" en este catalogo. Ningun intent
# declara hoy cardinalidad sobre ese tipo, asi que no afecta la compuerta
# ni la medicion de simulate_cascade.py -- pero es el mismo patron de
# catalogo incompleto, en otro tipo de entidad.

client: ecopulse

entity_catalog:
  region:
    - value: pance
      keywords: ["pance"]
    - value: sur
      keywords: ["sur", "ciudad jardin", "univalle"]
    - value: centro
      keywords: ["centro", "san pedro", "cam"]
    - value: norte
      keywords: ["norte", "menga"]
    - value: occidente
      keywords: ["occidente", "cristo rey", "farallones", "los cristales", "siloe"]
  node:
    - value: node-pance
      keywords: ["nodo pance"]
    - value: node-univalle
      keywords: ["nodo univalle"]
    - value: node-centro
      keywords: ["nodo centro"]
    - value: node-menga
      keywords: ["nodo menga"]
    - value: node-farallones
      keywords: ["nodo cristo rey", "nodo farallones"]
