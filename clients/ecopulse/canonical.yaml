# canonical.yaml v1 — EcoPulse
#
# Definicion formal de intenciones para el Nivel 1 (similitud semantica / embeddings).
# Cada intencion mapea oraciones canonicas reales hacia una accion del backend.
# Convencion: texto normalizado plano (sin tildes, con eñe protegida), alineado con frases.txt.
# Esquema completo con sensitive: bool obligatorio por regla de arquitectura.

client: ecopulse

routing:
  # Calibrado con el corpus de 67 mensajes reales de frases.txt
  # Techo maximo medido de saludos y cortesias en Nivel 1 es 0.5782
  threshold: 0.60
  # Debajo de 0.05 los aciertos del modelo son empates tecnicos inestables
  min_margin: 0.05

intents:
  - name: consultar_calidad_aire
    action: ["show_air_quality"]
    sensitive: false
    phrases:
      - "mostrame la calidad del aire de hoy"
      - "como esta el aire hoy"
      - "cual es el indice de calidad del aire"
      - "dele mostrame los datos del aire"
      - "oiga y como esta el aire por mi barrio"
      - "cuanto pm2.5 hay ahorita"
      - "que tan grave esta la contaminacion"
      - "por que esta tan contaminado hoy"
      - "que contamina mas en cali"
      - "mostrame que esta pasando"

  - name: comparar_calidad_aire
    action: ["compare_zones"]
    sensitive: false
    phrases:
      - "compara la calidad del aire entre siloe y ciudad jardin"
      - "donde esta mas limpio el aire en el centro o en pance"
      - "decime la diferencia de contaminacion entre menga y san pedro"
      - "entre el norte y el sur cual tiene mejor aire hoy"

  - name: consultar_pronostico
    action: ["show_forecast"]
    sensitive: false
    phrases:
      - "cuando va a mejorar el aire"
      - "como va a estar el aire manana en cali"
      - "mostrame el pronostico de contaminacion para esta semana"
      - "va a subir el pm2.5 en la tarde o baja"

  - name: solicitar_reporte
    action: ["generate_report"]
    sensitive: false
    phrases:
      - "dame el reporte semanal"
      - "enviame el pdf del mes pasado"
      - "repeti el ultimo reporte"
      - "parce mandame el reporte de una vez"
      - "quisiera un reporte completo de la ultima semana con los niveles de pm2.5 y ozono"

  - name: activar_alerta
    action: ["enable_alert"]
    sensitive: true
    phrases:
      - "activa las alertas de contaminacion"
      - "ve activame la alerta pues"
      - "avisame si sube la contaminacion"
      - "notificame cuando el aire este malo"

  - name: cancelar_alerta
    action: ["disable_alert"]
    sensitive: true
    phrases:
      - "cancela la notificacion de la tarde"
      - "quita la alerta de las mananas"
      - "no quiero mas notificaciones"
      - "listo cancela todo"
      - "no me mandes nada hoy"
      - "nunca me avises los fines de semana"

  - name: configurar_alerta
    action: ["configure_alert_rules"]
    sensitive: true
    phrases:
      - "configura la alerta para pm2.5"
      - "cambiame el limite de la alerta a 100 de aqi"
      - "subile el umbral a la alerta para que no suene tan seguido"

  - name: localizar_sensor
    action: ["locate_sensor"]
    sensitive: false
    phrases:
      - "busca el sensor mas cercano"
      - "encontra la ubicacion de chipichape"
      - "donde esta el sensor mas cercano"

  - name: consultar_estado_sensor
    action: ["get_sensor_health"]
    sensitive: false
    phrases:
      - "revisa el sensor de melendez"
      - "cual sensor esta fallando"
      - "decime el estado del sensor"
      - "hay algun problema con la estacion del sur"
      - "esta funcionando bien todo"

  - name: actualizar_datos_sensor
    action: ["trigger_sensor_sync"]
    sensitive: false
    phrases:
      - "actualiza los datos del sensor"
      - "recarga las mediciones del sensor"
      - "actualizame la medicion de la estacion"

  - name: agregar_sensor
    action: ["add_sensor_to_watchlist"]
    sensitive: true
    phrases:
      - "agrega el sensor nuevo a mi lista"
      - "añade el nodo de chipichape a mis sensores"
      - "guardame la estacion de melendez en mis favoritos"
      - "dejame este sensor guardado en mi lista"

  - name: recomendar_actividad_salud
    action: ["get_health_activity_advice"]
    sensitive: false
    phrases:
      - "podrias decirme si hoy es un buen dia para salir a correr"
      - "necesito saber si puedo salir a trotar"
      - "esta bien salir a hacer ejercicio con este aire"

  - name: pedir_ayuda_soporte
    action: ["show_help"]
    sensitive: false
    phrases:
      - "ayudame a entender estos datos"
      - "explicame que significa el indice aqi"
      - "guiame para configurar mi cuenta"
      - "quien reporta estos datos"
      - "se puede confiar en estos datos"
      - "ayudame con esto por favor"
