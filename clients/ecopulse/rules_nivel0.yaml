# rules_nivel0.yaml v1 — EcoPulse
#
# Extraido literalmente de EcoPulse-IAU-2026/backend/app/services/agent_core.py
# (el mismo agent_core.py que CLAUDE.md referencia en la regla de dependencia).
# Cada intent de abajo es una rama if/elif de ese archivo:
#   - las keywords del if/elif -> phrases
#   - los UIAction(type=...)   -> action
#   - las regiones/nodos de NodeDataService -> entity (el catalogo en si
#     vive en entities.yaml, no aca: las entidades no son de Nivel 0)
#
# Nivel 0 exige match exacto de la clausula completa contra una phrase
# (router.py _matchea_intent_nivel0). Las phrases de abajo eran keywords
# pensadas para matchear por substring dentro de un mensaje mas largo, no
# mensajes completos -- medido contra el corpus real (simulate_cascade.py),
# ese modo resolvia mal 3 de 4 casos no-saludo por keyword-hijack ("donde"
# en "Donde esta el sensor mas cercano" disparaba navegar_mapa en vez de
# dejar que Nivel 1 resolviera localizar_sensor). Bajo match exacto la
# mayoria de estas reglas casi nunca van a disparar contra una oracion
# completa: es intencional, no un defecto. El trabajo semantico real lo
# hace Nivel 1 (canonical.yaml); esta tabla dejo de ser un clasificador
# por keyword y quedo como atajo para frases cortas y completas.
#
# consultar_comunas_limpias se elimino: su diseño original exigia las dos
# keywords juntas (match: all, "comunas" AND "limpio"), algo sin
# traduccion honesta a match exacto de frase completa -- dejarla con una
# sola keyword habria creado un disparo que el diseño original nunca
# quiso.
#
# El orden de la lista `intents` preserva el orden original de las ramas
# if/elif: si un mensaje matchea mas de una, gana la primera de la lista,
# igual que en el codigo original (evaluacion secuencial, no la mas
# especifica ni la de mayor score).
#
# Ninguna accion de agent_core.py tiene efecto real (todas son
# navegacion/despliegue de UI de solo lectura), por eso sensitive: false
# en todas. El campo esta declarado desde ya por regla de arquitectura,
# aunque hoy no haya ningun caso true.

client: ecopulse

intents:
  - name: saludo_cortesia
    phrases:
      - "hola"
      - "buenas tardes"
      - "gracias"
      - "chao"
      - "como estas"
      - "todo bien por aca"
    entity: []
    action: ["reply_greeting"]
    sensitive: false

  - name: consultar_nodo_mas_contaminado
    phrases:
      - "nodo con mayor contaminacion"
      - "mas contaminado"
    entity: []
    action: ["navigate", "focus_node"]
    sensitive: false

  - name: consultar_pronostico
    phrases:
      - "calidad del aire manana"
      - "pronostico"
      - "prediccion"
    entity: []
    action: ["navigate"]
    sensitive: false

  - name: consultar_ruta_saludable
    phrases:
      - "ruta es mas saludable"
      - "correr"
    entity: []
    action: ["navigate", "enable_tool"]
    sensitive: false

  - name: consultar_plan_pance
    phrases:
      - "pance"
    entity: ["region"]
    action: ["show_quality_air"]
    sensitive: false

  - name: consultar_plan_caminata
    phrases:
      - "caminata"
      - "caminar"
      - "senderismo"
    entity: []
    action: ["navigate"]
    sensitive: false

  - name: consultar_plan_bici
    phrases:
      - "bici"
      - "bicicleta"
    entity: []
    action: ["navigate"]
    sensitive: false

  - name: consultar_plan_borondo
    phrases:
      - "borondo"
      - "turistico"
      - "tour"
    entity: []
    action: ["navigate"]
    sensitive: false

  - name: navegar_mapa
    phrases:
      - "mapa"
      - "nodos"
      - "ubicacion"
      - "donde"
    entity: []
    action: ["navigate"]
    sensitive: false

  - name: navegar_inicio
    phrases:
      - "inicio"
      - "home"
      - "principal"
    entity: []
    action: ["navigate"]
    sensitive: false
