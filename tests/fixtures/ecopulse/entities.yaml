# entities.yaml v1 — EcoPulse
#
# Catalogo de entidades para extract_entities(). Vive en su propio archivo,
# no en rules_nivel0.yaml (de donde salio originalmente al migrar
# agent_core.py) ni en canonical.yaml: las entidades no son de un nivel
# particular, las necesita el router para completar la accion de
# cualquier nivel (0, 1 o 2) que resuelva la intencion.
#
# "siloe" agregado como keyword de la region "occidente": aparecia en
# canonical.yaml (comparar_calidad_aire) y en frases.txt pero no en este
# catalogo, asi que la compuerta de cardinalidad de comparar_calidad_aire
# escalaba mensajes que deberia resolver. No hay acceso desde este repo
# al NodeDataService real para confirmar el node id -- geograficamente
# Siloe esta en la misma ladera occidental que Cristo Rey/Farallones/Los
# Cristales (ya cubiertos por "occidente"), asi que se agrego ahi. Si
# el backend real lo modela distinto, corregir aca.
#
# Pendiente, fuera de este barrido, y esto NO es deuda de catalogo: no
# falta un dato, falta el tipo. "melendez" y "chipichape" aparecen en
# canonical.yaml/frases.txt como nombres de sensor/estacion, nombrados en
# phrases de consultar_estado_sensor y localizar_sensor, pero no existe
# un tipo de entidad "sensor" en este archivo. Esos intents pueden
# clasificar bien en Nivel 0/1 y despachar de todos modos sin el
# parametro que su accion necesita: get_sensor_health sin node_id,
# locate_sensor sin destino. Es la misma clase de hueco que compare_zones
# tenia antes de que existiera la compuerta de cardinalidad -- ahi no
# fallaba porque nadie media, y esto no falla hoy porque ningun intent
# declara cardinalidad sobre un tipo que ni siquiera existe todavia.
# Arreglo pendiente: agregar el tipo "sensor" al catalogo y declarar
# entity/entity_cardinality en esos dos intents para que la compuerta
# los alcance.
#
# "periodo" (2026-09-19, canonical.yaml v2 / consultar_tendencia_calidad_aire):
# keywords elegidas para NO coincidir con vocabulario de otras intenciones.
# "hoy"/"de hoy"/"en el dia" quedaron descartadas a proposito -- aparecen
# literalmente en frases de consultar_calidad_aire (ej. "mostrame la
# calidad del aire de hoy"), asi que como marcador temporal no discriminan
# nada: extraerian periodo="24h" de cualquier mensaje que mencione "hoy",
# sin relacion con si el usuario pidio una tendencia. Verificado con grep
# contra canonical.yaml + rules_nivel0.yaml antes de elegir estas.

client: ecopulse

entity_catalog:
  periodo:
    - value: "24h"
      keywords: ["ultimas 24 horas", "24 horas", "hora por hora"]
    - value: mensual
      keywords: ["mensual", "historico mensual", "mes a mes", "ultimos meses", "este año"]
  region:
    - value: pance
      keywords: ["pance"]
    - value: sur
      keywords: ["sur", "ciudad jardin", "univalle"]
    - value: centro
      keywords: ["centro", "san pedro", "cam"]
    - value: norte
      keywords: ["norte", "menga"]
    - value: occidente
      keywords: ["occidente", "cristo rey", "farallones", "los cristales", "siloe"]
  node:
    - value: node-pance
      keywords: ["nodo pance"]
    - value: node-univalle
      keywords: ["nodo univalle"]
    - value: node-centro
      keywords: ["nodo centro"]
    - value: node-menga
      keywords: ["nodo menga"]
    - value: node-farallones
      keywords: ["nodo cristo rey", "nodo farallones"]
